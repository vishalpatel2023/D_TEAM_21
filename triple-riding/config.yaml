# ──────────────────────────────────────────────────────────────
# Triple-Riding Detection — Configuration
# ──────────────────────────────────────────────────────────────

model:
  path: "yolov8n.pt"                # Ultralytics model name or file path
  confidence_threshold: 0.35
  iou_threshold: 0.45
  image_size: 640

association:
  bbox_expansion_ratio: 0.20        # Expand motorcycle box by 20% on each side
  minimum_score: 0.35               # Ignore associations below this score
  weights:
    point_inside: 0.50
    horizontal_overlap: 0.25
    center_distance: 0.15
    vertical_relationship: 0.10

rider_count:
  minimum_violation_riders: 3       # 3 or more riders = violation

video:
  frame_skip: 0                     # 0 = every frame; 1 = every 2nd frame; etc.
  output_fps: null                  # null = use source FPS

visualization:
  show_association_lines: true
  show_confidence: true
  show_person_ids: true
  show_association_score: false
